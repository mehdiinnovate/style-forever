<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Bag - Style Forever</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#fff;color:#111;padding:16px;max-width:860px;margin:0 auto;font-size:14px}
header{border-bottom:1px solid #ccc;padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px}
button{padding:6px 12px;border:1px solid #ccc;background:#f5f5f5;cursor:pointer;font-size:13px}
.btn-main{background:#111;color:#fff;border-color:#111;width:100%;padding:10px;margin-top:12px;font-weight:700}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
.box{border:1px solid #ccc;padding:12px}
.item{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}
.item:last-child{border-bottom:none}
.item img{width:56px;height:56px;object-fit:cover;border:1px solid #ddd}
.item-info{flex:1}
.qty{display:inline-flex;align-items:center;gap:6px;margin-top:6px}
.qty button{padding:2px 8px}
.row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px}
.total{border-top:1px solid #ccc;padding-top:8px;font-weight:700;font-size:15px}
.hidden{display:none}
.empty{text-align:center;padding:40px 16px;border:1px solid #ccc}
</style>
</head>
<body>

<header>
  <button onclick="history.back()">Back</button>
  <h1>Style Forever - Bag (<span id="topCount">0</span>)</h1>
  <button onclick="clearCart()">Empty Bag</button>
</header>

<div id="emptyBox" class="empty hidden">
  <p style="margin-bottom:12px">Your bag is empty.</p>
  <button onclick="location.href='index.html'">Continue Shopping</button>
</div>

<div id="cartBox" class="grid">
  <div class="box" id="itemsList"></div>
  <div class="box">
    <h2 style="font-size:15px;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:6px">Order Summary</h2>
    <div class="row"><span>Items</span><span id="sumItems">0</span></div>
    <div class="row"><span>Subtotal</span><span id="sumSub">৳0</span></div>
    <div class="row"><span>Shipping</span><span>At checkout</span></div>
    <div class="row total"><span>Total</span><span id="sumTotal">৳0</span></div>
    <button class="btn-main" onclick="location.href='checkout.html'">Proceed to Checkout</button>
  </div>
</div>

<script>
let cart = [
  {name:"Premium Cotton Polo",size:"L",price:650,qty:1,img:"https://res.cloudinary.com/dwgvvzbvn/image/upload/v1788708839/b5fnlbs8a19t3hutx5wd.jpg"},
  {name:"Classic Denim Shirt",size:"XL",price:900,qty:1,img:"https://res.cloudinary.com/dwgvvzbvn/image/upload/v1788708839/b5fnlbs8a19t3hutx5wd.jpg"}
];

function render(){
  const totalQty = cart.reduce((a,b) => a + b.qty, 0);
  const subtotal = cart.reduce((a,b) => a + (b.price * b.qty), 0);
  document.getElementById("topCount").innerText = totalQty;

  if(cart.length === 0){
    document.getElementById("cartBox").classList.add("hidden");
    document.getElementById("emptyBox").classList.remove("hidden");
    return;
  }

  document.getElementById("emptyBox").classList.add("hidden");
  document.getElementById("cartBox").classList.remove("hidden");

  document.getElementById("itemsList").innerHTML = cart.map((it,i) =>
    `<div class="item">
      <img src="${it.img}" alt="">
      <div class="item-info">
        <div><strong>${it.name}</strong></div>
        <div style="font-size:12px;color:#555">Size: ${it.size} · ৳${it.price}</div>
        <div class="qty">
          <button onclick="changeQty(${i},-1)">-</button>
          <span>${it.qty}</span>
          <button onclick="changeQty(${i},1)">+</button>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:700;margin-bottom:6px">৳${it.price * it.qty}</div>
        <button onclick="removeItem(${i})">Remove</button>
      </div>
    </div>`
  ).join("");

  document.getElementById("sumItems").innerText = totalQty;
  document.getElementById("sumSub").innerText = "৳" + subtotal;
  document.getElementById("sumTotal").innerText = "৳" + subtotal;
}

function changeQty(i,d){
  cart[i].qty += d;
  if(cart[i].qty <= 0) cart.splice(i,1);
  render();
}

function removeItem(i){
  cart.splice(i,1);
  render();
}

function clearCart(){
  cart = [];
  render();
}

render();
</script>
</body>
</html>
